# Optional HTTPS edge. Supply an existing certificate directory; no automatic deployment.
services:
  postgres:
    logging: &bounded_logs
      driver: local
      options: {max-size: "10m", max-file: "5"}
  redis:
    logging: *bounded_logs
  api:
    logging: *bounded_logs
  worker:
    logging: *bounded_logs
  ingestion-worker:
    logging: *bounded_logs
  agent-worker:
    logging: *bounded_logs
  browser:
    logging: *bounded_logs
  proxy:
    profiles: [production]
    image: ${NGINX_IMAGE:-nginx:stable-bookworm}
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    user: "10001:10001"
    ports:
      - "${PKB_HTTPS_BIND:-127.0.0.1}:${PKB_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PKB_TLS_DIR:?Set an absolute certificate directory}:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:rw,size=16777216"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
    pids_limit: 32
    logging: *bounded_logs
    restart: unless-stopped
