worker_processes 1;
pid /tmp/nginx.pid;
# Raw request errors can include callback credentials/query data.
error_log /dev/null crit;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 10s;
    limit_req_zone $binary_remote_addr zone=callback:1m rate=30r/s;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        location = /wecom/callback {
            limit_except GET POST { deny all; }
            limit_req zone=callback burst=100 nodelay;
            limit_req_status 429;
            proxy_http_version 1.1;
            proxy_set_header Host api;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_connect_timeout 1s;
            proxy_send_timeout 4s;
            proxy_read_timeout 4s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_pass http://api:8000;
        }
        location / { return 404; }
    }
}
